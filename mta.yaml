_schema-version: 3.3.0
ID: my_capm
description: A simple CAP project.
version: 1.0.0
modules:
- name: my_capm-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: my_capm-db
  - name: uaa_my_capm
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: my_capm-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: my_capm-db
  parameters:
    buildpack: nodejs_buildpack
- name: my_capm-destination-content
  type: com.sap.application.content
  requires:
  - name: my_capm-destination-service
    parameters:
      content-target: true
  - name: my_capm_html_repo_host
    parameters:
      service-key:
        name: my_capm_html_repo_host-key
  - name: uaa_my_capm
    parameters:
      service-key:
        name: uaa_my_capm-key
  parameters:
    content:
      instance:
        destinations:
        - Name: poapprouter_my_capm_html_repo_host
          ServiceInstanceName: my_capm-html5-app-host-service
          ServiceKeyName: my_capm_html_repo_host-key
          sap.cloud.service: poapprouter
        - Authentication: OAuth2UserTokenExchange
          Name: poapprouter_uaa_my_capm
          ServiceInstanceName: my_capm-xsuaa-service
          ServiceKeyName: uaa_my_capm-key
          sap.cloud.service: poapprouter
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: my_capm-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: my_capm_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - poapplication.zip
      name: poapplication
      target-path: resources/
- name: poapplication
  type: html5
  path: app/poapplication
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: my_capm-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: my_capm-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: my_capm-destination-service
    service-plan: lite
  requires:
  - name: srv-api
- name: my_capm_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: my_capm-html5-app-host-service
    service-plan: app-host
- name: uaa_my_capm
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: my_capm-xsuaa-service
    service-plan: application
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
